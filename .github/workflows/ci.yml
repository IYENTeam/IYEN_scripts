name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check shell syntax
        run: |
          bash -n hooks/pre-commit
          bash -n scripts/sync-skills

      - name: Run skill validation and policy tests
        run: npm test

      - name: Verify document index
        run: npm run docs:list

      - name: Audit repository skill budget
        run: npm run skills:clean
